{# The licence mark shown in the page header (not the site brand): tiny WebP at three sizes, the browser picks one
   for the screen, with a small PNG fallback. Shown on every page and every screen size. #}
{% if license.published %}<a class="license-logo" href="/license" aria-label="{{ license.short }}. Tap for the license details" title="{{ license.short }}">{% else %}<span class="license-logo" role="img" aria-label="Licensed" title="Licensed">{% endif %}<picture><source type="image/webp" srcset="/static/img/brand/tl-logo-64.webp 64w, /static/img/brand/tl-logo-128.webp 128w, /static/img/brand/tl-logo-256.webp 256w" sizes="(max-width: 860px) 28px, 36px"><img src="/static/img/brand/tl-logo-128.png" alt="" width="36" height="36" decoding="async"></picture>{% if license.published %}</a>{% else %}</span>{% endif %}
